$kind: http-example
name: 404 Not Found
request:
  method: GET
  url: '{{baseUrl}}/api/sessions/{{sessionId}}'
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "Session not found"
      }
