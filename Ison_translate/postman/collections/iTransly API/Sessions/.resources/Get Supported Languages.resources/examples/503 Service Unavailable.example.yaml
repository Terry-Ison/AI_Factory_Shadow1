$kind: http-example
name: 503 Service Unavailable
request:
  method: GET
  url: '{{baseUrl}}/api/languages'
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "DeepL is not configured on this server"
      }
