$kind: http-example
name: 200 OK
request:
  method: GET
  url: '{{baseUrl}}/api/languages'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "languages": [
          { "code": "en", "label": "English" },
          { "code": "fr", "label": "French" },
          { "code": "de", "label": "German" },
          { "code": "es", "label": "Spanish" },
          { "code": "ja", "label": "Japanese" },
          { "code": "zh", "label": "Chinese (Simplified)" }
        ],
        "cached": false
      }
