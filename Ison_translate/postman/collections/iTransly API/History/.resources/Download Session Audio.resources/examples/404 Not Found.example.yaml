$kind: http-example
name: 404 Not Found
request:
  method: GET
  url: '{{baseUrl}}/api/history/sessions/{{sessionId}}/audio/{{recordingId}}'
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "Recording not found"
      }
