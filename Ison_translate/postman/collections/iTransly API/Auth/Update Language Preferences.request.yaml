$kind: http-request
name: Update Language Preferences
method: PATCH
url: '{{baseUrl}}/api/auth/me/languages'
description: Update the authenticated user's default source and target translation languages.
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "defaultSourceLang": "en",
      "defaultTargetLang": "fr"
    }
examples: './.resources/Update Language Preferences.resources/examples'
