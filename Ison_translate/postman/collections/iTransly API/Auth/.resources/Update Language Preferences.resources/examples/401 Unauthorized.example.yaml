$kind: http-example
name: 401 Unauthorized
request:
  method: PATCH
  url: '{{baseUrl}}/api/auth/me/languages'
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "Unauthorized"
      }
